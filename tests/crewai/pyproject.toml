[project]
name = "crewai-showcase"
version = "0.1.0"
description = "Showcase and testing suite for CrewAI"
requires-python = ">=3.11"
dependencies = [
    "crewai==1.15.30",
    "langchain-openai",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
markers = [
    "static: For static structure and configuration tests.",
    "behavioral: For behavioral, routing, and constraint tests using mocks.",
    "live: For end-to-end tests executing real model calls (disabled in CI).",
]
