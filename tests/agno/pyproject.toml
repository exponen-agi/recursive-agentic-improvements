[project]
name = "agno-showcase"
version = "0.1.0"
description = "Showcase and testing suite for Agno"
requires-python = ">=3.11"
dependencies = [
    "agno==3.1.3",
    "openai",
    "sqlalchemy",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
markers = [
    "static: For static structure and configuration tests.",
    "behavioral: For behavioral, routing, and constraint tests using mocks.",
    "live: For end-to-end tests executing real model calls (disabled in CI).",
]
