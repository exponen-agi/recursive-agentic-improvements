[project]
name = "google-adk-showcase"
version = "0.1.0"
description = "Showcase and testing suite for Google ADK"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.9.1",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
markers = [
    "static: For static structure and configuration tests.",
    "behavioral: For behavioral, routing, and constraint tests using mocks.",
    "live: For end-to-end tests executing real model calls (disabled in CI).",
]
