[project]
name = "langgraph-showcase"
version = "0.1.0"
description = "Showcase and testing suite for LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.15",
    "langchain>=1.0",
    "langchain-openai",
    "pytest",
    "python-dotenv",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
markers = [
    "static: For static structure and configuration tests.",
    "behavioral: For behavioral, routing, and constraint tests using mocks.",
    "live: For end-to-end tests executing real model calls (disabled in CI).",
]
