name: CI

# Runs the mocked, offline test suite for each framework showcase in tests/.
# No repository secrets are used or required — every test uses a mocked
# model, per tests/TEST_CONSTITUTION.md, so a real API key is never needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.framework }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        framework: [agno, crewai, langgraph, google_adk]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "tests/${{ matrix.framework }}/uv.lock"

      - name: Install dependencies
        working-directory: tests/${{ matrix.framework }}
        run: uv sync --locked

      - name: Run tests (static + behavioral only, no live model calls)
        working-directory: tests/${{ matrix.framework }}
        run: uv run pytest -m "not live" -v

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run installer unit tests (node:test — no extra dependency)
        working-directory: installer
        run: npm test
