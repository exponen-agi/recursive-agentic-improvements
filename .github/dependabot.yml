# Weekly update PRs for CI actions and the pinned test dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /installer
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /tests/agno
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /tests/crewai
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /tests/langgraph
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /tests/google_adk
    schedule:
      interval: weekly
