# Weekly update PRs for CI actions and the pinned test dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /installer
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directories:
      - /tests/agno
      - /tests/crewai
      - /tests/langgraph
      - /tests/google_adk
    schedule:
      interval: weekly
